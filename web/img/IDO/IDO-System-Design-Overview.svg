<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">IDO system design overview</title>
  <desc id="description">Architecture summary of the Inorganic Demand Orchestrator, including demand, signals, capacity, policy evaluation, decisions, actions, persistence, and safety controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf9"/>
      <stop offset="1" stop-color="#f2e9e4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4f3"/>
      <stop offset="1" stop-color="#eee7e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22223b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a8c98"/>
    </marker>
    <style>
      .heading { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #22223b; }
      .subtitle { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #4a4e69; }
      .section-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #22223b; }
      .card-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #22223b; }
      .body { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #4a4e69; }
      .small { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #4a4e69; letter-spacing: 0.5px; }
      .tiny { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #6d6875; }
      .badge { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0.7px; }
      .decision { font: 700 15px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1480" cy="80" r="150" fill="#c9ada7" opacity="0.10"/>
  <circle cx="80" cy="820" r="190" fill="#9a8c98" opacity="0.08"/>

  <text x="70" y="78" class="heading">IDO - Inorganic Demand Orchestrator</text>
  <text x="70" y="112" class="subtitle">Safe, auditable rollout control plane for approved large-scale resource demand</text>

  <g transform="translate(1165 54)">
    <rect width="105" height="30" rx="15" fill="#4a4e69"/>
    <text x="52.5" y="20" class="badge" text-anchor="middle">LOW QPS</text>
    <rect x="116" width="132" height="30" rx="15" fill="#9a8c98"/>
    <text x="182" y="20" class="badge" text-anchor="middle">TIMER-DRIVEN</text>
    <rect x="259" width="116" height="30" rx="15" fill="#c17c74"/>
    <text x="317" y="20" class="badge" text-anchor="middle">FAIL-CLOSED</text>
  </g>

  <text x="70" y="165" class="small">CONTROL-PLANE INPUTS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="450" height="145" rx="18" fill="#ffffff" stroke="#c9ada7"/>
    <rect x="575" y="185" width="450" height="145" rx="18" fill="#ffffff" stroke="#c9ada7"/>
    <rect x="1080" y="185" width="450" height="145" rx="18" fill="#ffffff" stroke="#c9ada7"/>
  </g>

  <circle cx="112" cy="229" r="21" fill="#f2e9e4"/>
  <path d="M102 229h20M112 219v20" stroke="#4a4e69" stroke-width="2.5" stroke-linecap="round"/>
  <text x="148" y="225" class="card-title">Approved Demand</text>
  <text x="148" y="249" class="body">IDT / Jaws + Capacity approval</text>
  <text x="96" y="286" class="tiny">Execution envelope  |  Priority  |  Rollout window</text>
  <text x="96" y="308" class="tiny">Forest demand  |  Scope grouping  |  Batch percentage</text>

  <circle cx="617" cy="229" r="21" fill="#f2e9e4"/>
  <path d="M606 237l8-9 7 5 9-13" fill="none" stroke="#4a4e69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="653" y="225" class="card-title">Live Operational Signals</text>
  <text x="653" y="249" class="body">Kusto metrics + ECS state</text>
  <text x="601" y="286" class="tiny">Progress  |  SSD/HDD consumption  |  Current allocation</text>
  <text x="601" y="308" class="tiny">Freshness  |  Source health  |  Forest coverage</text>

  <circle cx="1122" cy="229" r="21" fill="#f2e9e4"/>
  <path d="M1110 235h24M1114 229h16M1119 223h6" fill="none" stroke="#4a4e69" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1158" y="225" class="card-title">Capacity Context</text>
  <text x="1158" y="249" class="body">Capacity Optics + LB + PASTA</text>
  <text x="1106" y="286" class="tiny">SSD/HDD headroom  |  Tier capacity  |  Placement signals</text>
  <text x="1106" y="308" class="tiny">Reservations  |  Competing jobs  |  Resource shortfall</text>

  <path d="M295 330v48" stroke="#9a8c98" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M800 330v48" stroke="#9a8c98" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1305 330v48" stroke="#9a8c98" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="390" width="1460" height="335" rx="24" fill="url(#core)" stroke="#9a8c98" stroke-width="1.5"/>
  </g>
  <text x="105" y="435" class="section-title">IDO CONTROL PLANE</text>
  <text x="105" y="461" class="body">Next.js Portal + ASP.NET Core backend on Azure App Service</text>

  <g>
    <rect x="105" y="495" width="255" height="145" rx="16" fill="#ffffff" stroke="#c9ada7"/>
    <text x="130" y="530" class="card-title">1. Synchronize</text>
    <text x="130" y="560" class="body">Job Manager</text>
    <text x="130" y="585" class="body">Scheduler</text>
    <text x="130" y="610" class="body">Signal Synchronization</text>

    <rect x="395" y="495" width="255" height="145" rx="16" fill="#ffffff" stroke="#c9ada7"/>
    <text x="420" y="530" class="card-title">2. Evaluate</text>
    <text x="420" y="560" class="body">Pre-job and pre-scope gates</text>
    <text x="420" y="585" class="body">Execution checkpoints</text>
    <text x="420" y="610" class="body">Sandboxed policy logic</text>

    <rect x="685" y="495" width="255" height="145" rx="16" fill="#ffffff" stroke="#c9ada7"/>
    <text x="710" y="530" class="card-title">3. Allocate</text>
    <text x="710" y="560" class="body">Capacity Governance</text>
    <text x="710" y="585" class="body">Priority-aware allocation</text>
    <text x="710" y="610" class="body">Atomic next-batch admission</text>

    <rect x="975" y="495" width="255" height="145" rx="16" fill="#ffffff" stroke="#c9ada7"/>
    <text x="1000" y="530" class="card-title">4. Compose</text>
    <text x="1000" y="560" class="body">Capacity gate + policy gate</text>
    <text x="1000" y="585" class="body">Immutable evidence</text>
    <text x="1000" y="610" class="body">Explainable final decision</text>

    <rect x="1265" y="495" width="230" height="145" rx="16" fill="#ffffff" stroke="#c9ada7"/>
    <text x="1290" y="530" class="card-title">5. Act</text>
    <text x="1290" y="560" class="body">Action Gateway</text>
    <text x="1290" y="585" class="body">Revalidate before apply</text>
    <text x="1290" y="610" class="body">Audit every side effect</text>
  </g>

  <path d="M360 568h24" stroke="#9a8c98" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M650 568h24" stroke="#9a8c98" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M940 568h24" stroke="#9a8c98" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1230 568h24" stroke="#9a8c98" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(105 669)">
    <rect width="130" height="34" rx="17" fill="#e3f2e8" stroke="#7ca982"/>
    <circle cx="21" cy="17" r="5" fill="#4f8a5b"/>
    <text x="73" y="22" class="decision" text-anchor="middle" fill="#35613d">PROCEED</text>

    <rect x="145" width="110" height="34" rx="17" fill="#fff3d6" stroke="#d0a34a"/>
    <circle cx="166" cy="17" r="5" fill="#c28a2c"/>
    <text x="203" y="22" class="decision" text-anchor="middle" fill="#8c641f">HOLD</text>

    <rect x="270" width="110" height="34" rx="17" fill="#f8dfdf" stroke="#c17c74"/>
    <circle cx="291" cy="17" r="5" fill="#b05252"/>
    <text x="328" y="22" class="decision" text-anchor="middle" fill="#8d3f3f">HALT</text>
  </g>

  <g transform="translate(535 669)">
    <text x="0" y="22" class="small">SAFETY:</text>
    <text x="72" y="22" class="body">Fail closed</text>
    <circle cx="174" cy="17" r="3" fill="#9a8c98"/>
    <text x="190" y="22" class="body">Idempotent actions</text>
    <circle cx="332" cy="17" r="3" fill="#9a8c98"/>
    <text x="348" y="22" class="body">Versioned snapshots</text>
    <circle cx="505" cy="17" r="3" fill="#9a8c98"/>
    <text x="521" y="22" class="body">Failure isolation</text>
    <circle cx="638" cy="17" r="3" fill="#9a8c98"/>
    <text x="654" y="22" class="body">Human-authorized AI proposals</text>
  </g>

  <path d="M420 725v42" stroke="#9a8c98" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M800 725v42" stroke="#9a8c98" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1180 725v42" stroke="#9a8c98" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="140" y="780" width="360" height="72" rx="18" fill="#ffffff" stroke="#c9ada7"/>
    <rect x="620" y="780" width="360" height="72" rx="18" fill="#ffffff" stroke="#c9ada7"/>
    <rect x="1100" y="780" width="360" height="72" rx="18" fill="#ffffff" stroke="#c9ada7"/>
  </g>
  <text x="320" y="811" class="card-title" text-anchor="middle">ECS Rollout Control</text>
  <text x="320" y="836" class="tiny" text-anchor="middle">Advance approved allocation by a safe batch</text>
  <text x="800" y="811" class="card-title" text-anchor="middle">Portal and Notifications</text>
  <text x="800" y="836" class="tiny" text-anchor="middle">Evidence, shortfall, status, and next step</text>
  <text x="1280" y="811" class="card-title" text-anchor="middle">Durable Audit Trail</text>
  <text x="1280" y="836" class="tiny" text-anchor="middle">Cosmos DB snapshots, evaluations, and actions</text>

  <text x="800" y="883" class="tiny" text-anchor="middle">Platform: Cosmos DB | Blob Storage | Azure Queue | Entra ID | Managed Identity | Application Insights</text>
</svg>
