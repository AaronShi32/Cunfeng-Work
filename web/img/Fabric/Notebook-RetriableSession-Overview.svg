<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Notebook retriable session overview</title><desc id="desc">A parent notebook run tracks multiple child execution attempts, preserving a familiar run ID while creating a new live Spark session after a forced session shutdown.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#eaf0f2"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#292b30" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f8c84"/></marker><style>.h{font:700 42px 'Segoe UI',Arial;fill:#292b30}.s{font:400 20px 'Segoe UI',Arial;fill:#5b7488}.t{font:700 18px 'Segoe UI',Arial;fill:#292b30}.b{font:400 14px 'Segoe UI',Arial;fill:#5b7488}.k{font:700 12px 'Segoe UI',Arial;fill:#7b8088;letter-spacing:.7px}.badge{font:700 11px 'Segoe UI',Arial;fill:white;letter-spacing:.5px}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1500" cy="80" r="150" fill="#d3d5d9" opacity=".1"/><circle cx="80" cy="820" r="175" fill="#6f8c84" opacity=".08"/>
  <text x="60" y="72" class="h">Fabric Notebook · Retriable Session</text><text x="60" y="108" class="s">Retry notebook execution after a forced Spark session shutdown</text>
  <g transform="translate(1200 48)"><rect width="110" height="30" rx="15" fill="#5b7488"/><text x="55" y="20" class="badge" text-anchor="middle">NOTEBOOK API</text><rect x="120" width="100" height="30" rx="15" fill="#6f8c84"/><text x="170" y="20" class="badge" text-anchor="middle">PARENT RUN</text><rect x="230" width="110" height="30" rx="15" fill="#ad8c5e"/><text x="285" y="20" class="badge" text-anchor="middle">NEW SESSION</text></g>
  <text x="60" y="166" class="k">RETRYABLE EXECUTION FLOW</text>
  <g filter="url(#shadow)"><rect x="60" y="190" width="300" height="170" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="425" y="190" width="330" height="170" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="820" y="190" width="330" height="170" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="1215" y="190" width="325" height="170" rx="18" fill="#fff" stroke="#d3d5d9"/></g>
  <text x="90" y="232" class="t">Notebook request</text><text x="90" y="268" class="b">Create, get, cancel, or retry</text><text x="90" y="296" class="b">V1 / V2 API</text><text x="90" y="332" class="k">SAME NOTEBOOK ARTIFACT</text>
  <text x="455" y="232" class="t">Retryable options</text><text x="455" y="268" class="b">Feature enabled with max attempts</text><text x="455" y="296" class="b">Disabled: normal execution path</text><text x="455" y="332" class="k">OPT-IN BEHAVIOR</text>
  <text x="850" y="232" class="t">Parent execution</text><text x="850" y="268" class="b">Synthetic run tracks lifecycle</text><text x="850" y="296" class="b">Users keep one parent run ID</text><text x="850" y="332" class="k">PARENT–CHILD MAPPING</text>
  <text x="1245" y="232" class="t">Live Spark session</text><text x="1245" y="268" class="b">Create session and rerun notebook</text><text x="1245" y="296" class="b">Child run executes normally</text><text x="1245" y="332" class="k">RETRY AFTER SESSION STOP</text>
  <path d="M360 275h57M755 275h57M1150 275h57" fill="none" stroke="#6f8c84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="416" class="k">PARENT AND CHILD RUN LIFECYCLE</text><rect x="60" y="440" width="1480" height="322" rx="22" fill="none" stroke="#6f8c84" stroke-width="2" stroke-dasharray="5 8"/>
  <rect x="110" y="490" width="290" height="210" rx="18" fill="#fff" stroke="#d3d5d9" filter="url(#shadow)"/><text x="145" y="536" class="t">Parent run</text><text x="145" y="574" class="b">Visible run ID</text><text x="145" y="602" class="b">Overall status and progress</text><text x="145" y="650" class="k">USER-FACING EXECUTION</text>
  <rect x="510" y="478" width="680" height="234" rx="18" fill="#e9eef1" stroke="#6f8c84" stroke-width="2"/><text x="550" y="520" class="t">Child execution attempts</text>
  <rect x="550" y="548" width="180" height="104" rx="14" fill="#fff" stroke="#d3d5d9"/><text x="640" y="584" class="t" text-anchor="middle">Attempt 1</text><text x="640" y="614" class="b" text-anchor="middle">Run notebook</text>
  <rect x="760" y="548" width="180" height="104" rx="14" fill="#fff" stroke="#d3d5d9"/><text x="850" y="584" class="t" text-anchor="middle">Attempt 2</text><text x="850" y="614" class="b" text-anchor="middle">New live session</text>
  <rect x="970" y="548" width="180" height="104" rx="14" fill="#fff" stroke="#d3d5d9"/><text x="1060" y="584" class="t" text-anchor="middle">Attempt N</text><text x="1060" y="614" class="b" text-anchor="middle">Up to max attempts</text>
  <path d="M730 600h24M940 600h24" stroke="#6f8c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M400 595h102" stroke="#6f8c84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1250" y="490" width="240" height="210" rx="18" fill="#fff" stroke="#d3d5d9" filter="url(#shadow)"/><text x="1280" y="536" class="t">Persistence</text><text x="1280" y="574" class="b">Parent-child run map</text><text x="1280" y="602" class="b">Execution state</text><text x="1280" y="650" class="k">MONITOR AND RETRIEVE</text><path d="M1190 595h52" stroke="#6f8c84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="818" class="b">Each child run uses standard notebook execution semantics; retries resume under the parent run identity.</text>
</svg>
