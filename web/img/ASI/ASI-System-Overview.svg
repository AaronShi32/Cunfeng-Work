<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Azure Service Insights overview</title><desc id="desc">ASI collects service telemetry and operational data, indexes it with Kusto and MDM, and provides searchable investigations, reports, and diagnostics.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#eaf0f2"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#292b30" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f8c84"/></marker><style>.h{font:700 42px 'Segoe UI',Arial;fill:#292b30}.s{font:400 20px 'Segoe UI',Arial;fill:#5b7488}.t{font:700 19px 'Segoe UI',Arial;fill:#292b30}.b{font:400 15px 'Segoe UI',Arial;fill:#5b7488}.k{font:700 12px 'Segoe UI',Arial;fill:#7b8088;letter-spacing:.7px}.badge{font:700 11px 'Segoe UI',Arial;fill:white;letter-spacing:.5px}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1500" cy="80" r="150" fill="#d3d5d9" opacity=".1"/><circle cx="80" cy="820" r="175" fill="#6f8c84" opacity=".08"/>
  <text x="60" y="72" class="h">Azure Service Insights</text><text x="60" y="108" class="s">Search, diagnose, and understand service health through telemetry and operational data</text>
  <g transform="translate(1260 48)"><rect width="100" height="30" rx="15" fill="#5b7488"/><text x="50" y="20" class="badge" text-anchor="middle">TELEMETRY</text><rect x="110" width="100" height="30" rx="15" fill="#6f8c84"/><text x="160" y="20" class="badge" text-anchor="middle">KUSTO</text><rect x="220" width="100" height="30" rx="15" fill="#ad8c5e"/><text x="270" y="20" class="badge" text-anchor="middle">INSIGHTS</text></g>
  <text x="60" y="166" class="k">DATA COLLECTION AND PROCESSING</text>
  <g filter="url(#shadow)"><rect x="60" y="190" width="330" height="180" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="475" y="190" width="330" height="180" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="890" y="190" width="290" height="180" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="1265" y="190" width="275" height="180" rx="18" fill="#fff" stroke="#d3d5d9"/></g>
  <text x="90" y="232" class="t">Service telemetry</text><text x="90" y="266" class="b">FCS control plane (RP)</text><text x="90" y="292" class="b">ACI data plane · OpenTelemetry</text><text x="90" y="328" class="b">Metrics, events, and logs</text>
  <text x="505" y="232" class="t">ETL and pipelines</text><text x="505" y="266" class="b">Local storage → monitor agent</text><text x="505" y="292" class="b">Data processing and aggregation</text><text x="505" y="328" class="b">Reliability · quality · capacity</text>
  <text x="920" y="232" class="t">Kusto / MDM</text><text x="920" y="266" class="b">18 data sources</text><text x="920" y="292" class="b">Tables and query views</text><text x="920" y="328" class="b">Searchable service history</text>
  <text x="1295" y="232" class="t">Service Insights</text><text x="1295" y="266" class="b">Search and visualize</text><text x="1295" y="292" class="b">DRI and TSG diagnostics</text><text x="1295" y="328" class="b">Shared workflows and reports</text>
  <path d="M390 280h77M805 280h77M1180 280h77" fill="none" stroke="#6f8c84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="430" class="k">OPERATIONS EXPERIENCE</text><rect x="60" y="454" width="1480" height="300" rx="22" fill="none" stroke="#6f8c84" stroke-width="2" stroke-dasharray="5 8"/>
  <g filter="url(#shadow)"><rect x="100" y="500" width="420" height="205" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="590" y="500" width="420" height="205" rx="18" fill="#fff" stroke="#d3d5d9"/><rect x="1080" y="500" width="420" height="205" rx="18" fill="#fff" stroke="#d3d5d9"/></g>
  <text x="135" y="548" class="t">Find the signal</text><text x="135" y="584" class="b">Search service and cluster data</text><text x="135" y="612" class="b">Correlate logs, metrics, and events</text><text x="135" y="660" class="k">DISCOVERABLE OPERATIONAL DATA</text>
