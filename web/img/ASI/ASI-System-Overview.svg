  <text x="1115" y="548" class="t">Share service insights</text><text x="1115" y="584" class="b">Centralized workflows for stakeholders</text><text x="1115" y="612" class="b">Internal adoption across 4 teams</text><text x="1115" y="660" class="k">80K PAGE VIEWS · 81 STAKEHOLDERS</text>
  <path d="M520 602h62M1010 602h62" fill="none" stroke="#6f8c84" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="818" class="b">Service health signals flow from collection to query, investigation, and shared operational guidance.</text>
